name: Publish on Github, Curseforge & Modrinth

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/openjdk/jdk:25-ubuntu
      options: --user root
    steps:
      - uses: actions/checkout@v7
      - run: ./gradlew build publishMods
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLISH_GITHUB_TOKEN }}
          MODRINTH_API_KEY: ${{ secrets.PUBLISH_MODRINTH_TOKEN }}
          CURSEFORGE_API_KEY: ${{ secrets.PUBLISH_CURSEFORGE_TOKEN }}
